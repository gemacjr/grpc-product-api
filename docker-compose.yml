services:
  postgres:
    image: postgres:16-alpine
    container_name: grpc-product-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-products}
      POSTGRES_USER: ${DB_USER:-product}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-product}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - product_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-product} -d ${DB_NAME:-products}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: grpc-product-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-products}
      DB_USER: ${DB_USER:-product}
      DB_PASSWORD: ${DB_PASSWORD:-product}
      GRPC_PORT: 9090
      SERVER_PORT: 8080
    ports:
      - "${GRPC_PORT:-9090}:9090"
      - "${SERVER_PORT:-8080}:8080"

volumes:
  product_pg_data:
